[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nam-redactor"
version = "0.1.0"
description = "Standalone local web app to redact RAMQ health insurance numbers (NAM) from PDF files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Patrik Montigny" }]
dependencies = [
    "pymupdf>=1.24,<2",
    # 10.1 is the floor for ImageFont.load_default(size=...), which returns a
    # scalable bundled font. Older versions raise TypeError, and the label
    # drawing has no system font to fall back on (CI is Linux).
    "pillow>=10.1.0",
    "paddleocr>=3,<4",
    "paddlepaddle>=3,<4",
    # Web layer. These are core, not an extra: a plain `pip install .` has to
    # yield a runnable app with no second step.
    "fastapi>=0.115",
    # Plain uvicorn, not uvicorn[standard]: uvloop/httptools need a compiler
    # on Windows and buy nothing for a single-user local tool.
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    # Person-name NER. The model is a pinned wheel, not on PyPI: without it
    # the app still runs but only finds names confirmed by a NAM or a label.
    "spacy>=3.8,<4",
    "fr_core_news_md @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    # Required by fastapi.testclient.
    "httpx>=0.27",
]

[project.scripts]
nam-redact-web = "nam_redactor.web.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nam_redactor*"]

[tool.setuptools.package-data]
# The compiled frontend ships inside the wheel so an install needs no node.
"nam_redactor.web" = ["dist/**/*", "dist/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
