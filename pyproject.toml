[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nam-redactor"
version = "0.1.0"
description = "Standalone local CLI tool to redact RAMQ health insurance numbers (NAM) from PDF files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Patrik Montigny" }]
dependencies = [
    "pymupdf>=1.24,<2",
    "pillow>=10.0.0",
    "paddleocr>=3,<4",
    "paddlepaddle>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
nam-redact = "nam_redactor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nam_redactor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
