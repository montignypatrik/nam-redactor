name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # No node step here: the compiled frontend is committed, so the Python
      # suite stays fast. The frontend job below is what keeps it honest.
      - name: Run unit and integration tests
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: |
          pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Type-check and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # The wheel ships nam_redactor/web/dist, so a source change without a
      # rebuilt bundle would ship a stale UI to anyone who pip-installs.
      - name: Fail if the committed build is stale
        run: git diff --exit-code -- nam_redactor/web/dist
